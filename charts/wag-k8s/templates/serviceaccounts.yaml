apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wag-k8s.fullname" . }}-issuer
  labels:
    {{- include "wag-k8s.labels" . | nindent 4 }}
  {{- with .Values.issuer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wag-k8s.fullname" . }}-rotate
  labels:
    {{- include "wag-k8s.labels" . | nindent 4 }}
  {{- with .Values.rotation.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
